#
# Servidor MCP de Zabbix
#
# Toda la configuracion esta en ./config.toml. Este fichero solo describe
# el contenedor: imagen, puertos publicados, volumenes y red.
#
# Arranque:
#   mkdir -p data/{assets,templates,logs}
#   docker compose up -d
#   docker compose logs -f
#

services:
  zabbix-mcp-server:
    image: manumora/zabbix-mcp-server:latest
    container_name: zabbix-mcp-server
    restart: unless-stopped

    # La imagen corre como usuario no-root. Le damos el UID:GID del host
    # para que pueda escribir en los bind mounts de ./data y en config.toml.
    user: "1000:1000"

    ports:
      - "8086:8086"   # servidor MCP    -> http://localhost:8086/mcp
      - "9090:9090"   # portal de admin -> http://localhost:9090/

    volumes:
      # Lectura-escritura: el portal de administracion reescribe este fichero,
      # y en el primer arranque se anade el usuario admin generado.
      - ./config.toml:/etc/zabbix-mcp/config.toml
      - ./data/assets:/etc/zabbix-mcp/assets
      - ./data/templates:/etc/zabbix-mcp/templates
      - ./data/logs:/var/log/zabbix-mcp

    networks:
      - zabbix

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Red creada por el stack de Zabbix (directorio ../docker), de ahi el
  # prefijo del proyecto en el nombre real.
  zabbix:
    name: docker_zabbix-network
    external: true
