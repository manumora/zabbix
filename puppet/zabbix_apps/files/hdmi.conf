# Número de conectores HDMI con un monitor conectado.
# Lee el estado de cada conector HDMI desde sysfs (legible por cualquier usuario,
# no requiere sudo). Devuelve 0 si no hay nada conectado o si el equipo no
# tiene conectores HDMI, y N >= 1 si hay N monitores conectados.
UserParameter=status.hdmi,cat /sys/class/drm/card*-HDMI*/status 2>/dev/null | grep -c '^connected'
