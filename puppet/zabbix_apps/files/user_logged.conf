# Usuario con sesión gráfica abierta en el equipo (la de LightDM, en tty7).
# Solo se tiene en cuenta tty7, así que no aparecen sesiones SSH, consolas ni la
# pantalla de login. Devuelve el nombre de usuario, o vacío si nadie ha iniciado sesión.
UserParameter=user.logged,who | awk '$2 == "tty7" {print $1; exit}'
