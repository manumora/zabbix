services:
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4-ubuntu-latest
    container_name: zabbix-server
    ports:
      - "10051:10051"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - /docker/zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
      - /docker/zabbix/dbscripts:/var/lib/zabbix/dbscripts:ro
      - /docker/zabbix/export:/var/lib/zabbix/export:rw
      - /docker/zabbix/modules:/var/lib/zabbix/modules:ro
      - /docker/zabbix/enc:/var/lib/zabbix/enc:ro
      - /docker/zabbix/ssh_keys:/var/lib/zabbix/ssh_keys:ro
      - /docker/zabbix/mibs:/var/lib/zabbix/mibs:ro
    env_file:
      - /docker/zabbix/env_vars/.env_db_pgsql
      - /docker/zabbix/env_vars/.env_srv
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    depends_on:
      - postgres-server
    networks:
      - zabbix-network
    restart: always

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.4-ubuntu-latest
    container_name: zabbix-web
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/zabbix/nginx:/etc/ssl/nginx:ro
      - /docker/zabbix/modules/:/usr/share/zabbix/modules/:ro
    env_file:
      - /docker/zabbix/env_vars/.env_db_pgsql
      - /docker/zabbix/env_vars/.env_web
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    depends_on:
      - postgres-server
      - zabbix-server
    networks:
      - zabbix-network
    restart: always

  zabbix-mcp-server:
    image: manumora/zabbix-mcp-server:latest
    container_name: zabbix-mcp-server
    # La imagen corre como usuario no-root. Le damos el UID:GID del host
    # para que pueda escribir en los bind mounts y en config.toml.
    user: "1000:1000"
    ports:
      - "8086:8086"   # servidor MCP    -> http://localhost:8086/mcp
      - "9090:9090"   # portal de admin -> http://localhost:9090/
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Lectura-escritura: el portal de administracion reescribe este fichero,
      # y en el primer arranque se anade el usuario admin generado.
      - /docker/mcp/config.toml:/etc/zabbix-mcp/config.toml:rw
      - /docker/mcp/assets:/etc/zabbix-mcp/assets:rw
      - /docker/mcp/templates:/etc/zabbix-mcp/templates:rw
      - /docker/mcp/logs:/var/log/zabbix-mcp:rw
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - zabbix-web
    networks:
      - zabbix-network
    restart: always

  postgres-server:
    image: postgres:15.19-trixie
    container_name: postgres-server
    volumes:
      - /docker/postgresql/data:/var/lib/postgresql/data:rw
    env_file:
      - /docker/zabbix/env_vars/.env_db_pgsql
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    networks:
      - zabbix-network
    restart: always

networks:
  zabbix-network:
    driver: bridge

secrets:
  POSTGRES_USER:
    file: /docker/zabbix/env_vars/.POSTGRES_USER
  POSTGRES_PASSWORD:
    file: /docker/zabbix/env_vars/.POSTGRES_PASSWORD
